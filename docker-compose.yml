services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ruangx
      POSTGRES_PASSWORD: ruangx
      POSTGRES_DB: ruangx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'ruangx-cluster-id'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka
    env_file: ./backend/.env.docker

  auth-service:
    build: ./backend/auth-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - kafka
    env_file: ./backend/.env.docker

  post-service:
    build: ./backend/post-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - kafka
    env_file: ./backend/.env.docker

  chat-service:
    build: ./backend/chat-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres
    env_file: ./backend/.env.docker

  notification-service:
    build: ./backend/notification-service
    ports:
      - "8084:8084"
    depends_on:
      - kafka
    env_file: ./backend/.env.docker

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://ruangx-api-dev.alfin.top
        NEXT_PUBLIC_WS_URL: wss://ruangx-api-dev.alfin.top/ws
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    env_file: ./frontend/.env.local

volumes:
  pgdata:
  kafka-data:
