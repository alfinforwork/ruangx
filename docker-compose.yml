services:
  postgres:
    image: postgres:16-alpine
    container_name: ruangx-db
    environment:
      POSTGRES_USER: ruangx
      POSTGRES_PASSWORD: ruangx_secret
      POSTGRES_DB: ruangx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruangx"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ruangx-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ruangx-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ruangx-api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      HTTP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ruangx
      DB_PASSWORD: ruangx_secret
      DB_NAME: ruangx
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis:6379
      REDIS_PASSWORD: ""
      JWT_SECRET: super-secret-key-change-in-production
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET: ruangx-media
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      ALLOWED_ORIGINS: "*"  # allow all during dev; change to specific origins in production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://ruangx-api-dev.alfin.top/api/v1
    container_name: ruangx-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: https://ruangx-api-dev.alfin.top/api/v1
      VITE_WS_URL: wss://ruangx-api-dev.alfin.top
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  miniodata: